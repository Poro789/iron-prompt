# GitHub Actions: 类型检查 + 测试 + 真实浏览器闸门 + 自动部署 GitHub Pages
# 纯静态站点：产物不经构建直接部署；test 作业里 tsc --noEmit 只做类型闸门，不产出文件
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # PR 上也跑测试，合并前就能发现问题（deploy 作业靠 if 跳过，不占 Pages 环境）
  pull_request:
    branches: ["main"]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # tools/visual-check.js 用 Node 的全局 fetch/WebSocket（≥21 才默认可用），别退回 20
          node-version: 22

      # 类型闸门：JSDoc + tsc --noEmit，不产出任何文件，产物仍是不经构建的 js/app.js
      - name: Install dev deps (typecheck)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: node tests/run.js

      # 真实浏览器闸门：水平溢出 + 可点目标 ≥44px + data-action 点击链路。
      # 用 ubuntu 镜像自带的 Chrome（工具也会读 CHROME_PATH）；失败时退出码 1，逐条列出状态与元素。
      - name: Browser gate (layout / touch targets / click path)
        run: node tools/visual-check.js 390

      # 失败时把截图带出来，人眼能立刻看出是哪个状态坏了
      - name: Upload browser-gate screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: .visual/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    # PR 只跑测试，不构建/部署 Pages
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 静态站点：index.html + css/js + PWA 资源
      - name: Prepare dist
        run: |
          mkdir -p dist/css dist/js
          cp index.html manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png sw.js dist/
          cp css/style.css dist/css/
          cp js/app.js dist/js/

      # 缓存失效联动：sw.js 的 CACHE 版本串跟随 js/app.js 里的 APP_VERSION
      - name: Stamp service worker version
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[0-9.]+" js/app.js)
          test -n "$VER" || { echo "APP_VERSION not found in js/app.js" >&2; exit 1; }
          echo "sw cache version -> ironlog-v$VER"
          sed -i "s/ironlog-v[0-9.]*/ironlog-v$VER/" dist/sw.js
          grep -n "const CACHE" dist/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4