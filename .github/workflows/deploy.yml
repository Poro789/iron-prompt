# GitHub Actions: 测试 + 自动构建并部署 GitHub Pages
# 纯静态站点，无构建步骤；推送 main 分支即触发部署
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 核心函数单测 + 应用冒烟测试（零依赖；显式路径避免跨 Node 版本发现行为差异）
      - name: Run tests
        run: node --test tests/core.test.mjs tests/app.smoke.test.mjs

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只发布运行所需文件，避免 .github / 测试 / 文档等随站点发布
      - name: Prepare dist
        run: |
          mkdir -p dist/css dist/js
          cp index.html dist/
          cp css/style.css dist/css/
          cp js/app.js js/core.js js/vue.global.prod.js dist/js/
          cp LICENSE dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
