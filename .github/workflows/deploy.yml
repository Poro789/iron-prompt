# GitHub Actions: 测试 + 自动部署 GitHub Pages
# 纯静态单文件站点，无构建步骤；推送 main 分支即触发部署
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # PR 上也跑测试，合并前就能发现问题（deploy 作业靠 if 跳过，不占 Pages 环境）
  pull_request:
    branches: ["main"]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node test-ironlog.js

  build:
    runs-on: ubuntu-latest
    needs: test
    # PR 只跑测试，不构建/部署 Pages
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 静态站点：index.html + css/js + PWA 资源
      - name: Prepare dist
        run: |
          mkdir -p dist/css dist/js
          cp index.html manifest.webmanifest icon.svg sw.js dist/
          cp css/style.css dist/css/
          cp js/app.js dist/js/

      # 缓存失效联动：sw.js 的 CACHE 版本串跟随 js/app.js 里的 APP_VERSION
      - name: Stamp service worker version
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[0-9.]+" js/app.js)
          test -n "$VER" || { echo "APP_VERSION not found in js/app.js" >&2; exit 1; }
          echo "sw cache version -> ironlog-v$VER"
          sed -i "s/ironlog-v[0-9.]*/ironlog-v$VER/" dist/sw.js
          grep -n "const CACHE" dist/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4